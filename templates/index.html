<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拼豆工具</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('fuse-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>
<body>
  <header class="toolbar">
    <div class="tb-row title-row">
      <div class="brand">拼豆工具</div>
      <span id="project-name-label" class="brand-sub"></span>
      <span class="spacer"></span>
      <button id="btn-theme" title="切换日间 / 夜间模式">🌙 夜间模式</button>
    </div>
    <div class="tb-row">
      <button id="btn-open-project" title="打开 .ssfbp 项目文件">打开项目</button>
      <button id="btn-import" class="primary">导入图片</button>
      <input type="file" id="file-input" accept="image/*" hidden>
      <input type="file" id="project-file-input" accept=".ssfbp" hidden>
      <label class="field">目标像素量
        <span class="target-pixels-wrap">
          <input type="number" id="target-pixels" min="100" max="80000" step="100" value="5000" title="图片压缩后的总像素量">
          <span id="target-pixels-btn" class="target-pixels-arrow" role="button" tabindex="-1" title="选择常用像素量" aria-label="选择常用像素量"></span>
          <div id="target-pixels-menu" class="dropdown-menu target-pixels-menu hidden"></div>
        </span>
      </label>
      <label class="chk"><input type="checkbox" id="chk-sharpen" checked>锐化</label>
      <label class="field">颜色距离
        <select id="sel-distance">
          <option value="lab" selected>Lab（人眼感知）</option>
          <option value="rgb">RGB</option>
        </select>
      </label>
      <button id="btn-recompress" title="按当前设置重新压缩并重新生成图案">重新压缩</button>
      <span class="spacer"></span>
      <div class="dropdown" id="fix-dropdown">
        <button id="btn-fix-menu" title="查看常见使用问题的修复说明">使用问题修复 <span class="caret">▾</span></button>
        <div id="fix-menu" class="dropdown-menu hidden">
          <button id="fix-item-gesture" class="dropdown-item">右键在界面上只画线不拖拽</button>
          <button id="fix-item-shortcuts" class="dropdown-item">快捷键说明</button>
        </div>
      </div>
      <span class="tb-divider"></span>
      <button id="btn-undo" disabled title="撤销上一步修改（Ctrl+Z）">撤销</button>
      <button id="btn-redo" disabled title="重做已撤销的修改（Ctrl+Y）">重做</button>
      <span id="undo-info" class="muted" title="当前单步记录数量（最多 20 步）">单步记录：0/20</span>
      <span id="autosave-indicator" class="indicator"></span>
      <span class="tb-divider"></span>
      <button id="btn-export" class="primary">导出图片</button>
      <button id="btn-save-project" disabled title="保存项目（Ctrl+Shift+S）">保存项目</button>
      <button id="btn-logout" class="hidden" title="退出登录">退出登录</button>
    </div>
    <div class="tb-row">
      <label class="field slider-field">颜色数量
        <input type="range" id="color-slider" min="2" max="2" value="2" disabled>
        <span id="slider-value">2</span>
      </label>
      <span id="used-colors" class="muted"></span>
      <span class="spacer"></span>
      <span class="hint">右键拖拽平移 · 滚轮缩放 · 快捷键说明见「使用问题修复 → 快捷键说明」</span>
    </div>
  </header>

  <main>
    <aside id="left-panel">
      <div class="panel-body">
        <nav class="tabs">
          <button class="tab active" data-tab="palette">色板配置</button>
          <button class="tab" data-tab="edit">编辑工具</button>
          <button id="left-panel-toggle" class="panel-toggle" type="button" title="收起色板配置与编辑工具">‹</button>
        </nav>

        <section id="tab-palette" class="tab-panel">
          <div class="panel-block">
            <div class="row">
              <select id="config-select" title="当前色板配置"></select>
            </div>
            <div class="row">
              <button id="btn-new-config" title="新建一个配置">新建</button>
              <button id="btn-import-config" title="从 CSV 文件导入配置">导入</button>
              <button id="btn-export-config" title="将当前配置导出为 CSV">导出CSV</button>
            </div>
            <div class="row">
              <button id="btn-rename-config" title="重命名当前配置">重命名</button>
              <button id="btn-delete-config" class="danger" title="删除当前配置">删除</button>
            </div>
            <input type="file" id="config-file-input" accept=".csv,text/csv" hidden>
          </div>
          <div class="panel-block grow">
            <div class="panel-title">颜色表（可直接编辑）</div>
            <div id="color-table" class="color-table"></div>
            <button id="btn-add-color" class="add-btn">+ 添加颜色</button>
          </div>
        </section>

        <section id="tab-edit" class="tab-panel hidden">
          <div class="panel-block">
            <div class="tool-row">
              <button id="tool-brush" class="tool" title="用当前颜色涂色（ESC 返回选择模式）">画笔</button>
              <button id="tool-picker" class="tool" title="点击像素取色（ESC 返回选择模式）">取色</button>
              <button id="tool-eraser" class="tool" title="擦除格子（空位）">橡皮</button>
              <button id="tool-crop" class="tool" title="裁剪图案（R 键；ESC 返回选择模式）">裁剪</button>
              <button id="tool-wand" class="tool" title="点击选中四向相连的相似颜色（M 键；容差可调）">魔棒</button>
            </div>
            <div class="mode-line">
              当前模式：<span id="mode-label" class="mode-label">选择模式</span>
              <span id="selection-controls" class="selection-controls hidden">
                <label class="chk" title="单击只选择与该像素四方向（上下左右）相连的同色像素">
                  <input type="checkbox" id="same-color-select">同色选区
                </label>
                <button id="select-highlight" type="button" class="tool-mini"
                  title="选中当前高亮色号的全部像素并取消高亮显示" disabled>选中高亮</button>
              </span>
              <span id="crop-controls" class="selection-controls hidden">
                <button id="btn-auto-crop" type="button" class="tool-mini" title="自动收缩到非空格的包围盒">自动裁剪</button>
                <button id="btn-apply-crop" type="button" class="primary tool-mini" title="应用裁剪并退出裁剪模式">应用</button>
              </span>
              <label class="field brush-size-field hidden" id="brush-size-wrap"
                title="画笔 / 橡皮的矩形边长 = 2 × 数值 − 1（仅画笔与橡皮模式显示）">
                <span>尺寸</span>
                <input type="range" id="brush-size" min="1" max="10" value="1">
                <span id="brush-size-value" class="brush-size-value">1</span>
              </label>
              <label class="field wand-sensitivity-field hidden" id="wand-sensitivity-wrap"
                title="魔棒容差：0 表示只选同色，数值越大纳入越多相似色（仅魔棒模式显示）">
                <span>容差</span>
                <input type="range" id="wand-sensitivity" min="0" max="100" value="20">
                <span id="wand-sensitivity-value" class="wand-sensitivity-value">20</span>
              </label>
            </div>
            <div class="brush-info">
              当前画笔：<span id="brush-swatch" class="swatch"></span><span id="brush-label"></span>
            </div>
          </div>
          <div class="panel-block grow">
            <div class="panel-title">全部颜色（点击选用）</div>
            <div id="color-list" class="color-list"></div>
          </div>
        </section>
      </div>
      <button id="left-panel-expand" class="panel-expand" type="button" title="展开色板配置与编辑工具">
        <span class="pe-label">色板配置 · 编辑工具</span>
        <span class="pe-icon">›</span>
      </button>
    </aside>

    <section id="canvas-area">
      <div id="canvas-toolbar">
        <button id="zoom-in" title="放大">＋</button>
        <button id="zoom-out" title="缩小">－</button>
      <button id="zoom-fit" title="缩放到适合窗口">适应窗口</button>
      <span id="zoom-label">100%</span>
      <label class="chk" title="将工作区分成左右两块：左侧显示原图，右侧显示拼豆图"><input type="checkbox" id="chk-compare">对比原图</label>
      <label class="chk" title="左侧原图与右侧拼豆图使用一致的坐标与缩放"><input type="checkbox" id="chk-sync-pan">同步拖拽</label>
      <label class="chk"><input type="checkbox" id="chk-codes" checked title="仅影响工作区显示，不影响导出">显示色号</label>
      <label class="field empty-style-field" title="仅影响工作区显示，不影响导出">透明色
        <select id="empty-style">
          <option value="default">默认（浅灰）</option>
          <option value="black">纯黑</option>
          <option value="white">纯白</option>
        </select>
      </label>
      <span id="cell-info" class="muted"></span>
    </div>
      <div id="canvas-scroll">
        <div id="compare-wrap">
          <div id="compare-original" class="compare-pane">
            <canvas id="canvas-original"></canvas>
          </div>
          <div id="bead-pane" class="compare-pane">
            <canvas id="canvas"></canvas>
          </div>
        </div>
        <div id="empty-hint">请先导入一张图片<br>导入后会自动转换为拼豆图案</div>
      </div>
      <div id="crop-magnifier" class="crop-magnifier hidden"><canvas id="crop-magnifier-canvas"></canvas></div>
      <div id="quick-picker" class="hidden"></div>
    </section>

    <aside id="color-highlight-panel">
      <div class="panel-body">
        <div class="panel-head" id="color-highlight-panel-head" title="点击收起 / 展开">
          <span class="panel-title">颜色清单</span>
          <span class="spacer"></span>
          <span class="panel-chevron">›</span>
        </div>
        <div class="panel-block grow">
          <div id="highlight-color-list" class="highlight-color-list"></div>
        </div>
      </div>
      <button id="color-highlight-panel-expand" class="panel-expand" type="button" title="展开颜色清单">
        <span class="pe-label">颜色清单</span>
        <span class="pe-icon">‹</span>
      </button>
    </aside>

    <aside id="right-panel">
      <div class="panel-body">
        <div class="panel-head" id="right-panel-head" title="点击收起 / 展开">
          <span class="panel-title">事务历史</span>
          <span id="dirty-indicator" class="dirty-indicator hidden" title="当前画布有尚未保存为事务的修改">有未保存的修改</span>
          <span class="spacer"></span>
          <span class="panel-chevron">›</span>
        </div>
        <div class="panel-block">
          <div class="row">
            <button id="btn-save-state-side" class="primary" title="Ctrl+S / Cmd+S">保存当前状态</button>
            <button id="btn-clear-all" class="danger" title="清空画布并删除全部事务历史">清空所有状态</button>
          </div>
          <div id="history-list"></div>
          <div id="history-empty" class="muted">暂无历史记录</div>
        </div>
      </div>
      <button id="right-panel-expand" class="panel-expand" type="button" title="展开事务历史">
        <span class="pe-label">事务历史</span>
        <span class="pe-icon">‹</span>
      </button>
    </aside>
  </main>

  <div id="doc-dialog" class="dialog-mask hidden">
    <div class="dialog dialog-wide">
      <h3>使用问题修复</h3>
      <div class="dialog-body">
        <div id="doc-content" class="doc-content"></div>
      </div>
      <div class="dialog-actions">
        <button id="doc-close" class="primary">关闭</button>
      </div>
    </div>
  </div>

  <div id="export-dialog" class="dialog-mask hidden">
    <div class="dialog dialog-wide">
      <h3>导出图片</h3>
      <div id="dlg-busy" class="dlg-busy hidden">
        <div class="dlg-progress"><div class="dlg-progress-bar"></div></div>
        <div id="dlg-status" class="dlg-status">正在导出…</div>
      </div>
      <div class="dialog-body">
        <div class="dlg-preview-wrap">
          <canvas id="dlg-preview" class="dlg-preview"></canvas>
          <div id="dlg-pdf-pages" class="dlg-pdf-pages hidden"></div>
          <div id="dlg-preview-mask" class="dlg-preview-mask hidden">
            <div class="dlg-preview-progress"></div>
            <span>正在更新预览…</span>
          </div>
        </div>
        <div class="dlg-options">
          <label class="field">每格大小（像素）
            <input type="number" id="dlg-cell-size" min="5" max="100" value="28">
          </label>
          <label class="chk"><input type="checkbox" id="dlg-grid-lines" checked>显示网格线</label>
          <label class="field">外部白边（像素）
            <input type="number" id="dlg-pad" min="0" max="200" value="20">
          </label>
          <label class="chk" title="在导出图片四周显示浅蓝底行列号"><input type="checkbox" id="dlg-edge-numbers">显示行列号</label>
          <label class="chk"><input type="checkbox" id="dlg-codes" checked>显示色号</label>
          <label class="chk"><input type="checkbox" id="dlg-legend" checked>附带色号图例</label>
          <label class="field">透明色
            <select id="dlg-empty-style">
              <option value="default">默认（浅灰）</option>
              <option value="black">纯黑</option>
              <option value="white">纯白</option>
            </select>
          </label>
          <label class="field">格式
            <select id="dlg-format">
              <option value="jpg" selected>JPG</option>
              <option value="png">PNG</option>
              <option value="pdf-a4">PDF (A4单页)</option>
              <option value="pdf-multi-a4">PDF (A4多页)</option>
              <option value="pdf-a3-a4">PDF (A3或A4)</option>
            </select>
          </label>
        </div>
      </div>
      <div class="dialog-actions">
        <button id="dlg-export-cancel">取消</button>
        <button id="dlg-export-ok" class="primary">导出</button>
      </div>
    </div>
  </div>

  <div id="login-mask" class="dialog-mask hidden">
    <div class="dialog">
      <h3>需要 Token 验证</h3>
      <div class="dialog-body">
        <p class="muted">请输入访问 Token 后继续使用本工具。</p>
        <input type="password" id="login-token" placeholder="Token" autocomplete="current-password">
        <div id="login-error" class="login-error hidden"></div>
      </div>
      <div class="dialog-actions">
        <button id="btn-login" class="primary">登录</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
