[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.pyright]
include = ["app.py", "bead"]
exclude = ["**/__pycache__"]
typeCheckingMode = "basic"
pythonVersion = "3.10"